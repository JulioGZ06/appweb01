{% extends 'layout.html' %}
{% block content %}
  <div class="container-fluid">
    <h1>{{ titulo }}</h1>

    <p>{{ mensaje }}</p>

    <p>Estos son los productos que ofrecemos.</p>
  </div>
  <div id="carouselExampleControls" class="carousel slide mx-auto" data-ride="carousel" style="max-width: 300px;">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{{ url_for('static', filename='img/productos/Don_Julio.png') }}" class="d-block mx-auto" style="max-width: 300px; height: auto;" alt="Don Julio" />
      </div>
      <div class="carousel-item">
        <img src="{{ url_for('static', filename='img/productos/G4.png') }}" class="d-block mx-auto" style="max-width: 300px; height: auto;" alt="G4" />
      </div>
      <div class="carousel-item">
        <img src="{{ url_for('static', filename='img/productos/Solarum.png') }}" class="d-block mx-auto" style="max-width: 300px; height: auto;" alt="Solarum" />
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-target="#carouselExampleControls" data-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-target="#carouselExampleControls" data-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </button>
  </div>
{% endblock %}
